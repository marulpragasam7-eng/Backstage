# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Restricting broad "write-all" permissions to only what is explicitly required for security best practices
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 1. Generate the project classpath file so the Playwright CLI can locate your project dependencies
    - name: Build Project Classpath
      run: mvn dependency:build-classpath -Dmdep.outputFile=cp.txt

    # 2. Install the Playwright OS system dependencies (Replaces your sudo step safely)
    - name: Install Playwright OS Dependencies
      run: java -cp "$(cat cp.txt)" com.microsoft.playwright.CLI install-deps

    # 3. Explicitly download and install the required browser binaries (Uncommented and fixed)
    - name: Install Playwright Browsers
      run: java -cp "$(cat cp.txt)" com.microsoft.playwright.CLI install

    # 4. Execute your test suite headlessly via Maven
    - name: Build with Maven
      run: xvfb-run --auto-servernum mvn -B package --file pom.xml
      env:
        CI: true

    # 5. Securely upload the full dependency graph to GitHub
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
