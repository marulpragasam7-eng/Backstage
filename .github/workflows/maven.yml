name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions: write-all

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 1. Install the native OS dependencies Playwright requires
    - name: Install Playwright OS Dependencies
      run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install-deps"

    # 2. Install xvfb on the Linux runner to provide a virtual display server
    - name: Install Xvfb Display Server
      run: sudo apt-get install -y xvfb

    # 3. Wrap your build command inside 'xvfb-run' to execute tests in a headed browser state
    - name: Build and Run Headed Tests with Maven
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" mvn -B package --file pom.xml
      env:
        CI: false # Set to false so PlaywrightManager launches the headed UI browser
