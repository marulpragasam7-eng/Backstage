name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions: write-all

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 1. Install the native OS dependencies Playwright requires
    - name: Install Playwright OS Dependencies
      run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install-deps"

    # 2. Install xvfb on the Linux runner to provide a virtual display server
    - name: Install Xvfb Display Server
      run: sudo apt-get install -y xvfb

    # 3. Wrap your build command inside 'xvfb-run' to execute tests in a headed browser state
    - name: Build and Run Headed Tests with Maven
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" mvn -B package --file pom.xml
      env:
        CI: false # Set to false so PlaywrightManager launches the headed UI browser

    # 4. Upload videos, trace logs, and Extent Reports
    - name: Upload Test Recording & Report Artifacts
      if: always() # Ensures reports upload even if a test or build fails
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-results
        path: |
          target/videos/
          target/traces/
          target/ExtentReport/
          target/*.html
        retention-days: 7

  # New job to deploy the Extent Report to a live URL via GitHub Pages
  deploy-report:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    permissions: write-all

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Download Reports
      uses: actions/download-artifact@v4
      with:
        name: test-execution-results
        path: report-data

    # Finds your generated HTML report and copies it to index.html at the root of the publishing directory
    - name: Structure Report for GitHub Pages
      run: |
        cd report-data
        # Find any HTML file generated by Extent Reports and copy it to index.html at the root level
        find . -name "*.html" -exec cp {} ./index.html \;
        echo "Root directory contents for verification:"
        ls -la

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./report-data
        publish_branch: gh-pages
